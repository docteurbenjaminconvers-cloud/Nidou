name: Mise en ligne
# Met à jour le serveur de production (VPS OVH) après chaque envoi sur main, seulement si les tests sont passés.
# Ne fait rien tant que les secrets du serveur ne sont pas renseignés (voir deploy/DEPLOIEMENT.md, section 6).
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mise-en-ligne
  cancel-in-progress: false
jobs:
  deployer:
    # Uniquement un envoi sur main de ce dépôt dont les tests sont verts (jamais une proposition venue d'un fork).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.NIDOU_URL || 'https://app.nidou.fr' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Serveur configuré ?
        id: config
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::notice::Pas encore de serveur (secret VPS_HOST vide) : mise en ligne ignorée."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Clé SSH
        if: steps.config.outputs.pret == 'oui'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/nidou
          chmod 600 ~/.ssh/nidou
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Mettre à jour le serveur
        if: steps.config.outputs.pret == 'oui'
        run: |
          ssh -i ~/.ssh/nidou -p "${{ secrets.VPS_PORT || '22' }}" -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER || 'ubuntu' }}@$VPS_HOST" \
            "bash ${{ vars.NIDOU_DOSSIER || '~/nidou' }}/deploy/mettre-a-jour.sh"
      - name: Vérifier depuis l'extérieur
        if: steps.config.outputs.pret == 'oui'
        run: |
          URL="${{ vars.NIDOU_URL || 'https://app.nidou.fr' }}/health"
          for i in $(seq 1 12); do curl -fsS "$URL" && exit 0; sleep 5; done
          echo "::error::$URL ne répond pas"; exit 1
