# Lucien en production sur un VPS (OVH ou autre) : Caddy (HTTPS automatique) devant l'application.
#   cp ../server/.env.example .env   # puis remplir
#   docker compose up -d --build
services:
  lucien:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      LUCIEN_DATA: /data
      PORT: "3000"
    volumes:
      - lucien-data:/data
    expose: ["3000"]

  sauvegarde:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      LUCIEN_DATA: /data
    volumes:
      - lucien-data:/data
    # une sauvegarde par jour, chiffrée et envoyée hors du serveur (LUCIEN_SAUVEGARDE_CLE, LUCIEN_S3_* dans .env) ; 14 copies chiffrées gardées dans /data/sauvegardes
    command: ["sh", "-c", "while true; do node scripts/sauvegarde.mjs; sleep 86400; done"]
    depends_on: [lucien]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAINE_APP: ${DOMAINE_APP:-app.monlucien.fr}
      DOMAINE_SITE: ${DOMAINE_SITE:-monlucien.fr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [lucien]

volumes:
  lucien-data:
  caddy-data:
  caddy-config:
