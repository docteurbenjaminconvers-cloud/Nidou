# Démo publique de Lucien sur Render (offre gratuite) : appli, API et connecteur IA, avec la famille de démonstration.
# Données fictives, effacées à chaque redémarrage. Pas pour de vraies familles.
# Mise en ligne automatique à chaque envoi sur main, une fois les tests GitHub passés (autoDeployTrigger: checksPass).
services:
  - type: web
    name: lucien-demo
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    branch: main
    autoDeployTrigger: checksPass
    envVars:
      - key: LUCIEN_AUTH
        value: "0"
      - key: LUCIEN_SEED
        value: "1"
      - key: LUCIEN_DATA
        value: /tmp/lucien
      - key: LUCIEN_VEILLE
        value: "1"
      # Facultatif : sans clé, la lecture des papiers et l'assistant restent en mode démo. Render la demande à la création.
      - key: ANTHROPIC_API_KEY
        sync: false
